services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  model-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
      - ./:/workspace:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        ollama pull smollm2:135m;
        ollama create contasis-smollm2 -f /workspace/Modelfile;
        ollama list
    restart: "no"

  knowledge-init:
    build: .
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: ["python", "scripts/build_knowledge.py"]
    restart: "no"

  api:
    build: .
    depends_on:
      model-init:
        condition: service_completed_successfully
      knowledge-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: contasis-smollm2
      CONTASIS_DATA_DIR: /workspace/data
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s

  notebook:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      CONTASIS_API_URL: http://api:8000
    ports:
      - "8888:8888"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: >-
      /bin/sh -lc "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.token='' --ServerApp.password=''
      notebooks/Contasis_RAG_SmolLM2.ipynb"
    restart: unless-stopped

volumes:
  ollama_data:
